version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    # Vite builds static files. Environment variables prefixed with VITE_ 
    # should typically be available during build time. For a multi-stage Docker build,
    # you might need to pass build args or use a script to inject envs at runtime.
    # However, if your VITE_BACKEND_URL is relatively stable (e.g., your EC2 IP/domain), 
    # you can build the image with that env variable set.
    # To keep it simple for now, we'll map the env_file here, though for Vite,
    # you may need to ensure `.env` is present in the frontend folder before running `docker-compose up --build`.
    env_file:
      - ./frontend/.env
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
