apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spend-sense
  namespace: argocd
  # Ensure ArgoCD cascades deletes to child resources
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/HarshDalmia2005/Expense-Tracker-Opensoft.git
    targetRevision: main
    # ArgoCD watches everything inside the k8s/ directory
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: spend-sense

  syncPolicy:
    automated:
      prune: true        # delete resources removed from Git
      selfHeal: true     # revert any manual kubectl changes
    syncOptions:
      - CreateNamespace=true          # creates spend-sense ns if missing
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
